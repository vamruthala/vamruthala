<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" role="img" aria-labelledby="title desc">
<title id="title">Rotating healthcare and operations charts</title><desc id="desc">The healthcare chart shows case mix: outpatient 62 percent, inpatient 28 percent, daycare 10 percent. It transitions after five seconds to cafe baseline and scenario wait time bars. The scenario is illustrative, not observed live performance.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfcf8"/><stop offset="1" stop-color="#f0f5eb"/></linearGradient></defs>
<rect x="1" y="1" width="1038" height="368" rx="24" fill="url(#bg)" stroke="#d9e5d1"/>
<g font-family="Segoe UI,Arial,sans-serif">
 <g fill="#41583b" opacity="1"><text x="52" y="48" font-size="13" letter-spacing="2" fill="#70846a">HEALTHCARE ANALYTICS</text><text x="52" y="80" font-size="23" font-weight="700">Patient case type distribution</text><text x="52" y="105" font-size="13" fill="#71806d">Dashboard share of 498 distinct case numbers</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="10s" repeatCount="indefinite"/></g>
 <g opacity="1">
  <g stroke="#dbe5d6" stroke-width="1"><path d="M180 130H895M180 175H895M180 220H895M180 265H895"/></g><g font-size="11" fill="#72806c"><text x="145" y="269">0%</text><text x="139" y="224">20%</text><text x="139" y="179">40%</text><text x="139" y="134">60%</text></g>
  <path d="M180 265H895" stroke="#819578" stroke-width="1.5"/>
  <rect x="270" y="265" width="122" height="0" rx="9" fill="#6f925f"><animate attributeName="height" values="0;140;140;0;0" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="265;125;125;265;265" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="490" y="265" width="122" height="0" rx="9" fill="#8eae79"><animate attributeName="height" values="0;63;63;0;0" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="265;202;202;265;265" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="710" y="265" width="122" height="0" rx="9" fill="#c99061"><animate attributeName="height" values="0;23;23;0;0" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="265;242;242;265;265" keyTimes="0;.12;.45;.5;1" dur="10s" repeatCount="indefinite"/></rect>
  <g fill="#40583b" font-size="14" font-weight="700"><text x="331" y="119" text-anchor="middle">62%</text><text x="551" y="196" text-anchor="middle">28%</text><text x="771" y="236" text-anchor="middle">10%</text></g>
  <g fill="#566650" font-size="13"><text x="331" y="293" text-anchor="middle">Outpatient</text><text x="551" y="293" text-anchor="middle">Inpatient</text><text x="771" y="293" text-anchor="middle">Daycare</text></g>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="10s" repeatCount="indefinite"/>
 </g>
 <g opacity="0">
  <g fill="#41583b"><text x="52" y="48" font-size="13" letter-spacing="2" fill="#70846a">OPERATIONS ANALYTICS</text><text x="52" y="80" font-size="23" font-weight="700">Cafe average wait: baseline and scenario</text><text x="52" y="105" font-size="13" fill="#71806d">Wait time in minutes · scenario values from the case study</text></g>
  <g stroke="#dbe5d6" stroke-width="1"><path d="M170 135H900M170 180H900M170 225H900M170 270H900"/></g><path d="M170 270H900" stroke="#819578" stroke-width="1.5"/>
  <g font-size="12" fill="#72806c"><text x="135" y="274">0</text><text x="135" y="229">10</text><text x="135" y="184">20</text><text x="135" y="139">30</text></g>
  <rect x="270" y="270" width="105" height="0" rx="8" fill="#6f925f"><animate attributeName="height" values="0;0;65;65;0" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="270;270;205;205;270" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="390" y="270" width="105" height="0" rx="8" fill="#c99061"><animate attributeName="height" values="0;0;26;26;0" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="270;270;244;244;270" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="590" y="270" width="105" height="0" rx="8" fill="#6f925f"><animate attributeName="height" values="0;0;140;140;0" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="270;270;130;130;270" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="710" y="270" width="105" height="0" rx="8" fill="#c99061"><animate attributeName="height" values="0;0;57;57;0" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="270;270;213;213;270" keyTimes="0;.5;.62;.95;1" dur="10s" repeatCount="indefinite"/></rect>
  <g font-size="12" fill="#40583b" font-weight="700"><text x="322" y="198" text-anchor="middle">13.01</text><text x="442" y="237" text-anchor="middle">5.26</text><text x="642" y="123" text-anchor="middle">28.05</text><text x="762" y="207" text-anchor="middle">11.48</text></g>
  <g font-size="12" fill="#566650"><text x="322" y="294" text-anchor="middle">Table · baseline</text><text x="442" y="314" text-anchor="middle">Table · scenario</text><text x="642" y="294" text-anchor="middle">Food · baseline</text><text x="762" y="314" text-anchor="middle">Food · scenario</text></g>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.95;1" dur="10s" repeatCount="indefinite"/>
 </g>
</g>
</svg>




