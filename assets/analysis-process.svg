<g><circle cx="294" cy="96" r="13" fill="#e6efe0"/><text x="294" y="101" text-anchor="middle" font-size="12" font-weight="700">2</text><text x="315" y="101" font-size="16" font-weight="700">Prepare</text><text x="287" y="135" font-size="12" fill="#667761">Source · validate · shape</text><path d="M287 151h33m-33 7h24" fill="none" stroke="#87a978" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 3"><animate attributeName="stroke-dashoffset" values="0;26;0" dur="3s" repeatCount="indefinite"/></path></g>
