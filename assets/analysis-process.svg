<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
<title id="title">How I work: from business question to measurable action</title>
<desc id="desc">Five connected stages: frame the question, prepare data, analyze evidence, visualize insight, and guide action. A marker moves left to right along a curved green path.</desc>
