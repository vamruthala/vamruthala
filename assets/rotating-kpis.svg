<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="82" viewBox="0 0 1120 82" role="img" aria-labelledby="title desc">
<title id="title">KPI ticker synced with healthcare and operations charts</title><desc id="desc">A single green KPI bar switches between four healthcare dashboard measures and four cafe operations wait measures in sync with the chart carousel.</desc>
<defs><clipPath id="frame"><rect x="0" y="0" width="1120" height="82" rx="18"/></clipPath></defs><rect width="1120" height="82" rx="18" fill="#f6f9f3" stroke="#dce8d8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif}.value{font-size:19px;font-weight:700;fill:#486344}.label{font-size:11px;fill:#687966}.divider{stroke:#d4e0cd;stroke-width:1}</style>
<g clip-path="url(#frame)">
 <g>
  <g>
   <g transform="translate(20 0)"><text class="value" x="0" y="35">498</text><text class="label" x="0" y="55">distinct cases</text></g><path class="divider" d="M274 16v50"/>
   <g transform="translate(294 0)"><text class="value" x="0" y="35">$8.523M</text><text class="label" x="0" y="55">recorded revenue</text></g><path class="divider" d="M548 16v50"/>
   <g transform="translate(568 0)"><text class="value" x="0" y="35">1.28 days</text><text class="label" x="0" y="55">average length of stay</text></g><path class="divider" d="M822 16v50"/>
   <g transform="translate(842 0)"><text class="value" x="0" y="35">1.037</text><text class="label" x="0" y="55">average case-mix index</text></g>
   <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="10s" repeatCount="indefinite"/>
   <animateTransform attributeName="transform" type="translate" values="0 0;-12 0;0 0" dur="5s" additive="sum" repeatCount="indefinite"/>
  </g>
  <g>
   <g transform="translate(20 0)"><text class="value" x="0" y="35">13.01 min</text><text class="label" x="0" y="55">table wait · baseline</text></g><path class="divider" d="M274 16v50"/>
   <g transform="translate(294 0)"><text class="value" x="0" y="35">28.05 min</text><text class="label" x="0" y="55">food wait · baseline</text></g><path class="divider" d="M548 16v50"/>
   <g transform="translate(568 0)"><text class="value" x="0" y="35">5.26 min</text><text class="label" x="0" y="55">table wait · scenario</text></g><path class="divider" d="M822 16v50"/>
   <g transform="translate(842 0)"><text class="value" x="0" y="35">11.48 min</text><text class="label" x="0" y="55">food wait · scenario</text></g>
   <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.95;1" dur="10s" repeatCount="indefinite"/>
   <animateTransform attributeName="transform" type="translate" values="12 0;0 0;12 0" dur="5s" additive="sum" repeatCount="indefinite" begin="5s"/>
  </g>
 </g>
 <path d="M20 72H1100" stroke="#d8e5d1" stroke-width="1"/><circle r="3.3" fill="#88a978"><animateMotion dur="10s" repeatCount="indefinite" path="M24 72H1096"/></circle>
</g></svg>


